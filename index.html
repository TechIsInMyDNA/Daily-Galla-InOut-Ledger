<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Galla InOut Ledger</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--primary); display: flex; justify-content: space-between; align-items: center; }
    .btn { background: var(--border); color: var(--text); border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .btn-primary { background: var(--primary); color: #000; }
    .btn-green { background: var(--green); color: #000; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-sm { padding: 4px 8px; font-size: 0.75rem; }
    .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    label { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    input, select { background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; font-size: 0.95rem; width: 100%; }
    input:focus { border-color: var(--primary); outline: none; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .stat-box { background: #0f172a; border: 1px solid var(--border); padding: 12px; border-radius: 8px; text-align: center; }
    .stat-val { font-size: 1.3rem; font-weight: 700; margin-top: 4px; }
    .c-green { color: var(--green); }
    .c-red { color: var(--red); }
    .c-primary { color: var(--primary); }
    .log-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .log-item:last-child { border-bottom: none; }
    .log-desc { font-weight: 600; font-size: 0.9rem; }
    .log-meta { font-size: 0.75rem; color: var(--muted); }
    .badge { padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; }
    .badge-active { background: rgba(34, 197, 94, 0.2); color: var(--green); border: 1px solid var(--green); }
    .badge-closed { background: rgba(148, 163, 184, 0.2); color: var(--muted); border: 1px solid var(--muted); }
    .hidden { display: none !important; }
    #sync-status { font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="card" style="padding: 12px 16px;">
    <h1>
      <span>Daily Galla Ledger</span>
      <button class="btn btn-sm" onclick="toggleConfig()">⚙️ Settings</button>
    </h1>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
      <span id="shift-badge" class="badge badge-closed">NO ACTIVE SHIFT</span>
      <span id="sync-status">Checking sync...</span>
      <button class="btn btn-sm btn-primary" onclick="syncWithGitHub()">🔄 Live Sync</button>
    </div>
  </div>

  <!-- Settings Panel (Hidden by default) -->
  <div id="config-card" class="card hidden">
    <h3 style="font-size:1rem; margin-bottom:12px;">GitHub & Security Config</h3>
    <div class="input-group">
      <label>GitHub Username</label>
      <input type="text" id="cfg-user" placeholder="e.g. shubham-pharmacy" />
    </div>
    <div class="input-group">
      <label>Repo Name</label>
      <input type="text" id="cfg-repo" placeholder="e.g. galla-ledger" />
    </div>
    <div class="input-group">
      <label>GitHub Token (PAT with repo access)</label>
      <input type="password" id="cfg-token" placeholder="ghp_xxxxxxxxxxxx" />
    </div>
    <div class="input-group">
      <label>Master Passphrase (AES-256 Key)</label>
      <input type="password" id="cfg-pass" placeholder="Enter passphrase for decrypt/encrypt" />
    </div>
    <button class="btn btn-primary" style="width:100%;" onclick="saveConfig()">Save & Lock Configuration</button>
  </div>

  <!-- Stats Strip -->
  <div class="grid-3">
    <div class="stat-box">
      <div style="font-size:0.75rem; color:var(--muted);">OPENING</div>
      <div id="stat-open" class="stat-val">₹0</div>
    </div>
    <div class="stat-box">
      <div style="font-size:0.75rem; color:var(--muted);">NET IN / OUT</div>
      <div id="stat-net" class="stat-val">₹0</div>
    </div>
    <div class="stat-box">
      <div style="font-size:0.75rem; color:var(--muted);">LIVE GALLE ME</div>
      <div id="stat-live" class="stat-val c-primary">₹0</div>
    </div>
  </div>

  <!-- Check-In Action Card (When no active shift) -->
  <div id="checkin-card" class="card">
    <h3 style="margin-bottom:10px; font-size:1rem;">Start Shift (Check-In)</h3>
    <div class="input-group">
      <label>Opening Cash Float in Galla (₹)</label>
      <input type="number" id="in-open-cash" placeholder="e.g. 2000" />
    </div>
    <button class="btn btn-green" style="width:100%;" onclick="startShift()">Check-In Now</button>
  </div>

  <!-- Active Shift Form (When shift active) -->
  <div id="active-card" class="card hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 style="font-size:1rem;">Add Galla Transaction</h3>
      <button class="btn btn-red btn-sm" onclick="endShiftPrompt()">Check-Out (Close Shift)</button>
    </div>
    <div class="grid-2">
      <div class="input-group">
        <label>Type</label>
        <select id="tx-type">
          <option value="IN">Cash IN (Aaya)</option>
          <option value="OUT">Cash OUT (Diya)</option>
        </select>
      </div>
      <div class="input-group">
        <label>Amount (₹)</label>
        <input type="number" id="tx-amount" placeholder="e.g. 250" />
      </div>
    </div>
    <div class="input-group">
      <label>Description / Reason</label>
      <input type="text" id="tx-desc" placeholder="Chai / Distributor payment / Dawa bikri" />
    </div>
    <button class="btn btn-primary" style="width:100%;" onclick="addTransaction()">Save Entry</button>
  </div>

  <!-- Transactions Log -->
  <div class="card">
    <h3 style="font-size:0.95rem; margin-bottom:10px;">Shift Activity Log</h3>
    <div id="log-list">
      <div style="color:var(--muted); font-size:0.85rem; text-align:center; padding:12px;">No entries logged for current shift.</div>
    </div>
  </div>
</div>

<script>
  // --- Military-Grade Web Crypto (AES-GCM 256-bit + PBKDF2) ---
  const CryptoEngine = {
    async deriveKey(passphrase, salt) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    },
    async encrypt(plainText, passphrase) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await this.deriveKey(passphrase, salt);
      const encoded = new TextEncoder().encode(plainText);
      const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded);
      return JSON.stringify({
        s: Array.from(salt),
        i: Array.from(iv),
        d: Array.from(new Uint8Array(cipher))
      });
    },
    async decrypt(packedString, passphrase) {
      const { s, i, d } = JSON.parse(packedString);
      const salt = new Uint8Array(s);
      const iv = new Uint8Array(i);
      const data = new Uint8Array(d);
      const key = await this.deriveKey(passphrase, salt);
      const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
      return new TextDecoder().decode(decrypted);
    }
  };

  // --- State & App Management ---
  let appState = {
    currentShift: null, // { id, checkinTime, checkoutTime, openingCash, entries: [], status: 'ACTIVE'|'CLOSED' }
    history: []
  };
  let fileSha = null;

  function init() {
    loadConfig();
    renderUI();
    if (getConfig().token && getConfig().pass) {
      syncWithGitHub();
      // Auto-sync every 30 seconds
      setInterval(syncWithGitHub, 30000);
    } else {
      toggleConfig();
    }
  }

  function getConfig() {
    return {
      user: localStorage.getItem('gl_user') || '',
      repo: localStorage.getItem('gl_repo') || '',
      token: localStorage.getItem('gl_token') || '',
      pass: sessionStorage.getItem('gl_pass') || ''
    };
  }

  function saveConfig() {
    localStorage.setItem('gl_user', document.getElementById('cfg-user').value.trim());
    localStorage.setItem('gl_repo', document.getElementById('cfg-repo').value.trim());
    localStorage.setItem('gl_token', document.getElementById('cfg-token').value.trim());
    sessionStorage.setItem('gl_pass', document.getElementById('cfg-pass').value.trim());
    toggleConfig();
    syncWithGitHub();
  }

  function loadConfig() {
    const cfg = getConfig();
    document.getElementById('cfg-user').value = cfg.user;
    document.getElementById('cfg-repo').value = cfg.repo;
    document.getElementById('cfg-token').value = cfg.token;
    document.getElementById('cfg-pass').value = cfg.pass;
  }

  function toggleConfig() {
    document.getElementById('config-card').classList.toggle('hidden');
  }

  // --- GitHub REST API Integration ---
  async function syncWithGitHub() {
    const cfg = getConfig();
    if (!cfg.user || !cfg.repo || !cfg.token || !cfg.pass) {
      document.getElementById('sync-status').textContent = 'Config required';
      return;
    }

    document.getElementById('sync-status').textContent = 'Syncing...';
    const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/data.json`;

    try {
      const res = await fetch(url, {
        headers: {
          'Authorization': `Bearer ${cfg.token}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      });

      if (res.status === 200) {
        const json = await res.json();
        fileSha = json.sha;
        const cipherText = atob(json.content);
        const decrypted = await CryptoEngine.decrypt(cipherText, cfg.pass);
        appState = JSON.parse(decrypted);
        document.getElementById('sync-status').textContent = 'Synced ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        renderUI();
      } else if (res.status === 404) {
        // File doesn't exist yet, push initial structure
        await pushToGitHub();
      }
    } catch (e) {
      console.error(e);
      document.getElementById('sync-status').textContent = 'Sync Error';
    }
  }

  async function pushToGitHub() {
    const cfg = getConfig();
    if (!cfg.user || !cfg.repo || !cfg.token || !cfg.pass) return;

    document.getElementById('sync-status').textContent = 'Pushing...';
    const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/data.json`;
    const encrypted = await CryptoEngine.encrypt(JSON.stringify(appState), cfg.pass);
    const payload = {
      message: `Ledger update: ${new Date().toISOString()}`,
      content: btoa(encrypted),
      sha: fileSha || undefined
    };

    try {
      const res = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${cfg.token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        const data = await res.json();
        fileSha = data.content.sha;
        document.getElementById('sync-status').textContent = 'Saved ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      } else {
        document.getElementById('sync-status').textContent = 'Push failed';
      }
    } catch (e) {
      console.error(e);
      document.getElementById('sync-status').textContent = 'Push error';
    }
  }

  // --- Business Logic & Shift Actions ---
  function startShift() {
    const val = parseFloat(document.getElementById('in-open-cash').value) || 0;
    appState.currentShift = {
      id: Date.now(),
      checkinTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' }),
      checkoutTime: null,
      openingCash: val,
      entries: [],
      status: 'ACTIVE'
    };
    document.getElementById('in-open-cash').value = '';
    renderUI();
    pushToGitHub();
  }

  function addTransaction() {
    const type = document.getElementById('tx-type').value;
    const amount = parseFloat(document.getElementById('tx-amount').value);
    const desc = document.getElementById('tx-desc').value.trim();

    if (!amount || amount <= 0 || !desc) {
      alert('Please fill amount and description');
      return;
    }

    appState.currentShift.entries.unshift({
      id: Date.now(),
      type,
      amount,
      desc,
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    });

    document.getElementById('tx-amount').value = '';
    document.getElementById('tx-desc').value = '';
    renderUI();
    pushToGitHub();
  }

  function endShiftPrompt() {
    const totals = calculateTotals();
    const actual = prompt(`Closing Shift!\nExpected Galla Cash: ₹${totals.live}\n\nEnter physical counted cash:`, totals.live);
    if (actual === null) return;

    appState.currentShift.checkoutTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
    appState.currentShift.status = 'CLOSED';
    appState.currentShift.actualCashCounted = parseFloat(actual) || 0;
    appState.currentShift.discrepancy = (parseFloat(actual) || 0) - totals.live;

    appState.history.unshift({ ...appState.currentShift });
    appState.currentShift = null;
    renderUI();
    pushToGitHub();
  }

  function calculateTotals() {
    if (!appState.currentShift) return { open: 0, net: 0, live: 0 };
    let net = 0;
    appState.currentShift.entries.forEach(e => {
      if (e.type === 'IN') net += e.amount;
      if (e.type === 'OUT') net -= e.amount;
    });
    return {
      open: appState.currentShift.openingCash,
      net: net,
      live: appState.currentShift.openingCash + net
    };
  }

  function renderUI() {
    const shift = appState.currentShift;
    const badge = document.getElementById('shift-badge');
    const checkinCard = document.getElementById('checkin-card');
    const activeCard = document.getElementById('active-card');

    if (shift && shift.status === 'ACTIVE') {
      badge.textContent = `ACTIVE SHIFT (Since ${shift.checkinTime})`;
      badge.className = 'badge badge-active';
      checkinCard.classList.add('hidden');
      activeCard.classList.remove('hidden');
    } else {
      badge.textContent = 'NO ACTIVE SHIFT';
      badge.className = 'badge badge-closed';
      checkinCard.classList.remove('hidden');
      activeCard.classList.add('hidden');
    }

    const totals = calculateTotals();
    document.getElementById('stat-open').textContent = `₹${totals.open}`;
    document.getElementById('stat-net').textContent = `${totals.net >= 0 ? '+' : ''}₹${totals.net}`;
    document.getElementById('stat-net').className = `stat-val ${totals.net >= 0 ? 'c-green' : 'c-red'}`;
    document.getElementById('stat-live').textContent = `₹${totals.live}`;

    // Render list
    const listEl = document.getElementById('log-list');
    if (!shift || shift.entries.length === 0) {
      listEl.innerHTML = `<div style="color:var(--muted); font-size:0.85rem; text-align:center; padding:12px;">No active entries.</div>`;
      return;
    }

    listEl.innerHTML = shift.entries.map(e => `
      <div class="log-item">
        <div>
          <div class="log-desc">${e.desc}</div>
          <div class="log-meta">${e.time} • ${e.type === 'IN' ? 'Cash In' : 'Payment Given'}</div>
        </div>
        <div style="font-weight:700;" class="${e.type === 'IN' ? 'c-green' : 'c-red'}">
          ${e.type === 'IN' ? '+' : '-'}₹${e.amount}
        </div>
      </div>
    `).join('');
  }

  window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
