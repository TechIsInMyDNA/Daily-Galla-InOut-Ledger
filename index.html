<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Galla InOut Ledger</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --card-border: #1e293b;
      --text: #f1f5f9;
      --muted: #64748b;
      --primary: #38bdf8;
      --green: #10b981;
      --red: #f43f5e;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 12px; padding-bottom: 30px; }
    .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .btn { background: var(--card-border); color: var(--text); border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.15s; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: #000; font-weight: 700; }
    .btn-green { background: var(--green); color: #000; font-weight: 700; }
    .btn-red { background: var(--red); color: #fff; font-weight: 700; }
    .btn-sm { padding: 4px 10px; font-size: 0.75rem; border-radius: 6px; }
    .input-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
    label { font-size: 0.72rem; text-transform: uppercase; color: var(--muted); font-weight: 700; letter-spacing: 0.5px; }
    input, select { background: #0b1120; border: 1px solid var(--card-border); color: #fff; padding: 10px; border-radius: 8px; font-size: 0.95rem; width: 100%; }
    input:focus, select:focus { border-color: var(--primary); outline: none; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .stat-box { background: #0b1120; border: 1px solid var(--card-border); padding: 10px; border-radius: 8px; text-align: center; }
    .stat-val { font-size: 1.15rem; font-weight: 800; margin-top: 4px; }
    .c-green { color: var(--green); }
    .c-red { color: var(--red); }
    .c-primary { color: var(--primary); }
    .log-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .log-item:last-child { border-bottom: none; }
    .log-desc { font-weight: 600; font-size: 0.9rem; }
    .log-meta { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
    .badge { padding: 3px 8px; border-radius: 5px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.5px; }
    .badge-active { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid var(--green); }
    .badge-closed { background: rgba(100, 116, 139, 0.15); color: var(--muted); border: 1px solid var(--muted); }
    .hidden { display: none !important; }
    .sync-text { font-size: 0.72rem; color: var(--muted); font-family: monospace; }
  </style>
</head>
<body>

<div class="container">
  <!-- Minimal Top Header -->
  <div class="card flex-between" style="padding: 10px 14px;">
    <div>
      <div style="font-weight: 800; font-size: 1.05rem; letter-spacing: 0.5px; color: var(--primary);">GALLA INOUT LEDGER</div>
      <div id="sync-status" class="sync-text">Checking credentials...</div>
    </div>
    <div style="display:flex; gap:6px; align-items:center;">
      <button class="btn btn-sm btn-primary" onclick="syncWithGitHub()">↻ Sync</button>
      <button class="btn btn-sm" onclick="toggleConfig()">⚙️</button>
    </div>
  </div>

  <!-- Settings Panel (Hidden by default once filled) -->
  <div id="config-card" class="card hidden">
    <div class="flex-between" style="margin-bottom:10px;">
      <h3 style="font-size:0.95rem;">Configuration & Security</h3>
      <button class="btn btn-sm" onclick="toggleConfig()">✕ Close</button>
    </div>
    <div class="input-group">
      <label>GitHub Username</label>
      <input type="text" id="cfg-user" value="TechIsInMyDNA" />
    </div>
    <div class="input-group">
      <label>Repo Name</label>
      <input type="text" id="cfg-repo" value="Daily-Galla-InOut-Ledger" />
    </div>
    <div class="input-group">
      <label>Fine-grained GitHub Token (Contents: Read/Write)</label>
      <input type="password" id="cfg-token" placeholder="github_pat_xxxx..." />
    </div>
    <div class="input-group">
      <label>Master Passphrase (Encrypted with AES-GCM)</label>
      <input type="password" id="cfg-pass" placeholder="Counter secret passphrase" />
    </div>
    <button class="btn btn-primary" style="width:100%;" onclick="saveConfig()">Lock & Connect</button>
  </div>

  <!-- Live Status Bar -->
  <div class="flex-between" style="padding: 0 4px;">
    <span id="shift-badge" class="badge badge-closed">NO ACTIVE SHIFT</span>
    <span id="shift-time" style="font-size:0.75rem; color:var(--muted);"></span>
  </div>

  <!-- 3-Column Real-time Counter Stats -->
  <div class="grid-3">
    <div class="stat-box">
      <label>Opening Galla</label>
      <div id="stat-open" class="stat-val">₹0</div>
    </div>
    <div class="stat-box">
      <label>Net In/Out</label>
      <div id="stat-net" class="stat-val">₹0</div>
    </div>
    <div class="stat-box" style="border-color: rgba(56, 189, 248, 0.4);">
      <label style="color: var(--primary);">Live Drawer</label>
      <div id="stat-live" class="stat-val c-primary">₹0</div>
    </div>
  </div>

  <!-- Check-In Module (Visible when shift is inactive) -->
  <div id="checkin-card" class="card">
    <h3 style="margin-bottom:8px; font-size:0.95rem;">Solo Counter Check-In</h3>
    <p style="font-size:0.8rem; color:var(--muted); margin-bottom:12px;">Dukan ka galla sambhalte waqt drawer me physical cash ginke shuru karein.</p>
    <div class="input-group">
      <label>Opening Cash Float (₹)</label>
      <input type="number" id="in-open-cash" placeholder="e.g. 2500" />
    </div>
    <button class="btn btn-green" style="width:100%;" onclick="startShift()">✓ Check-In (Start Shift)</button>
  </div>

  <!-- Active Shift Entry Module (Visible when shift is active) -->
  <div id="active-card" class="card hidden">
    <div class="flex-between" style="margin-bottom:12px;">
      <h3 style="font-size:0.95rem;">Log Galla Movement</h3>
      <button class="btn btn-red btn-sm" onclick="endShiftPrompt()">Close Shift (Check-Out)</button>
    </div>
    <div class="grid-2">
      <div class="input-group">
        <label>Movement Type</label>
        <select id="tx-type">
          <option value="IN">Cash IN (Aaya)</option>
          <option value="OUT">Cash OUT (Diya)</option>
        </select>
      </div>
      <div class="input-group">
        <label>Amount (₹)</label>
        <input type="number" id="tx-amount" placeholder="e.g. 500" />
      </div>
    </div>
    <div class="input-group">
      <label>Reason / Note / Party</label>
      <input type="text" id="tx-desc" placeholder="Chai / Distributor Cash / Patient Payment" />
    </div>
    <button class="btn btn-primary" style="width:100%;" onclick="addTransaction()">Save Entry</button>
  </div>

  <!-- Shift Timeline Log -->
  <div class="card">
    <div class="flex-between" style="margin-bottom:8px;">
      <h3 style="font-size:0.9rem;">Shift Movement Log</h3>
      <span id="log-count" style="font-size:0.75rem; color:var(--muted);">0 entries</span>
    </div>
    <div id="log-list">
      <div style="color:var(--muted); font-size:0.82rem; text-align:center; padding:12px;">Galla is idle. No entries logged.</div>
    </div>
  </div>
</div>

<script>
  // --- Military-Grade Web Crypto (PBKDF2 + AES-GCM 256-bit) ---
  const CryptoEngine = {
    async deriveKey(passphrase, salt) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    },
    async encrypt(plainText, passphrase) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await this.deriveKey(passphrase, salt);
      const encoded = new TextEncoder().encode(plainText);
      const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded);
      return JSON.stringify({
        s: Array.from(salt),
        i: Array.from(iv),
        d: Array.from(new Uint8Array(cipher))
      });
    },
    async decrypt(packedString, passphrase) {
      const { s, i, d } = JSON.parse(packedString);
      const salt = new Uint8Array(s);
      const iv = new Uint8Array(i);
      const data = new Uint8Array(d);
      const key = await this.deriveKey(passphrase, salt);
      const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
      return new TextDecoder().decode(decrypted);
    }
  };

  let appState = {
    currentShift: null,
    history: []
  };
  let fileSha = null;

  function getConfig() {
    return {
      user: localStorage.getItem('gl_user') || 'TechIsInMyDNA',
      repo: localStorage.getItem('gl_repo') || 'Daily-Galla-InOut-Ledger',
      token: localStorage.getItem('gl_token') || '',
      pass: localStorage.getItem('gl_pass') || ''
    };
  }

  function saveConfig() {
    localStorage.setItem('gl_user', document.getElementById('cfg-user').value.trim());
    localStorage.setItem('gl_repo', document.getElementById('cfg-repo').value.trim());
    localStorage.setItem('gl_token', document.getElementById('cfg-token').value.trim());
    localStorage.setItem('gl_pass', document.getElementById('cfg-pass').value.trim());
    toggleConfig();
    syncWithGitHub();
  }

  function loadConfigFields() {
    const cfg = getConfig();
    document.getElementById('cfg-user').value = cfg.user;
    document.getElementById('cfg-repo').value = cfg.repo;
    document.getElementById('cfg-token').value = cfg.token;
    document.getElementById('cfg-pass').value = cfg.pass;
  }

  function toggleConfig() {
    document.getElementById('config-card').classList.toggle('hidden');
  }

  function formatDateTime(date = new Date()) {
    const d = date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    const t = date.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
    return `${d}, ${t}`;
  }

  // --- GitHub Live Sync Engine ---
  async function syncWithGitHub() {
    const cfg = getConfig();
    if (!cfg.token || !cfg.pass) {
      document.getElementById('sync-status').textContent = '⚠️ Settings missing';
      document.getElementById('config-card').classList.remove('hidden');
      return;
    }

    document.getElementById('sync-status').textContent = '⚡ Syncing...';
    const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/data.json`;

    try {
      const res = await fetch(url, {
        headers: {
          'Authorization': `Bearer ${cfg.token}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      });

      if (res.status === 200) {
        const json = await res.json();
        fileSha = json.sha;
        const decodedContent = decodeURIComponent(escape(atob(json.content.replace(/\s/g, ''))));
        const decrypted = await CryptoEngine.decrypt(decodedContent, cfg.pass);
        appState = JSON.parse(decrypted);
        document.getElementById('sync-status').textContent = `● Live Synced (${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})})`;
        renderUI();
      } else if (res.status === 404) {
        await pushToGitHub();
      } else {
        document.getElementById('sync-status').textContent = `Sync failed (${res.status})`;
      }
    } catch (e) {
      console.error(e);
      document.getElementById('sync-status').textContent = 'Key mismatch / Sync error';
    }
  }

  async function pushToGitHub() {
    const cfg = getConfig();
    if (!cfg.token || !cfg.pass) return;

    document.getElementById('sync-status').textContent = 'Saving...';
    const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/data.json`;
    const encrypted = await CryptoEngine.encrypt(JSON.stringify(appState, null, 2), cfg.pass);
    const encodedPayload = btoa(unescape(encodeURIComponent(encrypted)));

    const payload = {
      message: `Galla Ledger update: ${new Date().toISOString()}`,
      content: encodedPayload,
      sha: fileSha || undefined
    };

    try {
      const res = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${cfg.token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        const data = await res.json();
        fileSha = data.content.sha;
        document.getElementById('sync-status').textContent = `● Live Synced (${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})})`;
      } else {
        document.getElementById('sync-status').textContent = 'Commit failed';
      }
    } catch (e) {
      console.error(e);
      document.getElementById('sync-status').textContent = 'Push Error';
    }
  }

  // --- Core Ledger Operations ---
  function startShift() {
    const openVal = parseFloat(document.getElementById('in-open-cash').value) || 0;
    const now = formatDateTime();

    appState.currentShift = {
      id: Date.now(),
      checkinTime: now,
      checkoutTime: null,
      openingCash: openVal,
      entries: [
        {
          id: Date.now(),
          type: 'INFO',
          amount: openVal,
          desc: 'Checked In - Opening Drawer Float',
          timestamp: now
        }
      ],
      status: 'ACTIVE'
    };

    document.getElementById('in-open-cash').value = '';
    renderUI();
    pushToGitHub();
  }

  function addTransaction() {
    const type = document.getElementById('tx-type').value;
    const amount = parseFloat(document.getElementById('tx-amount').value);
    const desc = document.getElementById('tx-desc').value.trim();

    if (!amount || amount <= 0 || !desc) {
      alert('Kripya amount aur reason dono fill karein!');
      return;
    }

    const now = formatDateTime();
    appState.currentShift.entries.unshift({
      id: Date.now(),
      type,
      amount,
      desc,
      timestamp: now
    });

    document.getElementById('tx-amount').value = '';
    document.getElementById('tx-desc').value = '';
    renderUI();
    pushToGitHub();
  }

  function endShiftPrompt() {
    const totals = calculateTotals();
    const actualStr = prompt(`Counter Check-Out!\nHisab ke mutabiq galle me hona chahiye: ₹${totals.live}\n\nPhysical counted cash kitna hai enter karein:`, totals.live);
    if (actualStr === null) return;

    const actual = parseFloat(actualStr) || 0;
    const now = formatDateTime();
    const discrepancy = actual - totals.live;

    appState.currentShift.checkoutTime = now;
    appState.currentShift.status = 'CLOSED';
    appState.currentShift.actualCashCounted = actual;
    appState.currentShift.discrepancy = discrepancy;

    appState.currentShift.entries.unshift({
      id: Date.now(),
      type: 'INFO',
      amount: actual,
      desc: `Check-Out: Counted ₹${actual} (${discrepancy === 0 ? 'Exact Match' : (discrepancy > 0 ? '+₹' + discrepancy + ' Extra' : '-₹' + Math.abs(discrepancy) + ' Short')})`,
      timestamp: now
    });

    appState.history.unshift({ ...appState.currentShift });
    appState.currentShift = null;

    renderUI();
    pushToGitHub();
  }

  function calculateTotals() {
    if (!appState.currentShift) return { open: 0, net: 0, live: 0 };
    let net = 0;
    appState.currentShift.entries.forEach(e => {
      if (e.type === 'IN') net += e.amount;
      if (e.type === 'OUT') net -= e.amount;
    });
    return {
      open: appState.currentShift.openingCash,
      net: net,
      live: appState.currentShift.openingCash + net
    };
  }

  function renderUI() {
    const shift = appState.currentShift;
    const badge = document.getElementById('shift-badge');
    const shiftTime = document.getElementById('shift-time');
    const checkinCard = document.getElementById('checkin-card');
    const activeCard = document.getElementById('active-card');

    if (shift && shift.status === 'ACTIVE') {
      badge.textContent = '● SHIFT ACTIVE';
      badge.className = 'badge badge-active';
      shiftTime.textContent = `Started: ${shift.checkinTime}`;
      checkinCard.classList.add('hidden');
      activeCard.classList.remove('hidden');
    } else {
      badge.textContent = 'NO ACTIVE SHIFT';
      badge.className = 'badge badge-closed';
      shiftTime.textContent = '';
      checkinCard.classList.remove('hidden');
      activeCard.classList.add('hidden');
    }

    const totals = calculateTotals();
    document.getElementById('stat-open').textContent = `₹${totals.open}`;
    document.getElementById('stat-net').textContent = `${totals.net >= 0 ? '+' : ''}₹${totals.net}`;
    document.getElementById('stat-net').className = `stat-val ${totals.net >= 0 ? 'c-green' : 'c-red'}`;
    document.getElementById('stat-live').textContent = `₹${totals.live}`;

    const listEl = document.getElementById('log-list');
    const countEl = document.getElementById('log-count');

    if (!shift || shift.entries.length === 0) {
      listEl.innerHTML = `<div style="color:var(--muted); font-size:0.82rem; text-align:center; padding:12px;">Galla is idle. No entries logged.</div>`;
      countEl.textContent = '0 entries';
      return;
    }

    countEl.textContent = `${shift.entries.length} entries`;
    listEl.innerHTML = shift.entries.map(e => {
      let colorClass = 'c-primary';
      let sign = '';
      if (e.type === 'IN') { colorClass = 'c-green'; sign = '+'; }
      if (e.type === 'OUT') { colorClass = 'c-red'; sign = '-'; }

      return `
        <div class="log-item">
          <div>
            <div class="log-desc">${e.desc}</div>
            <div class="log-meta">${e.timestamp} • ${e.type === 'IN' ? 'Galla Inflow' : (e.type === 'OUT' ? 'Galla Outflow' : 'Shift Milestone')}</div>
          </div>
          <div style="font-weight:800; font-size: 0.95rem;" class="${colorClass}">
            ${sign}₹${e.amount}
          </div>
        </div>
      `;
    }).join('');
  }

  // Initial load
  loadConfigFields();
  const cfg = getConfig();
  if (cfg.token && cfg.pass) {
    syncWithGitHub();
    setInterval(syncWithGitHub, 20000); // 20s live sync pulse
  } else {
    toggleConfig();
  }
</script>
</body>
</html>
